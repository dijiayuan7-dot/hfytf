name: Build AOD Suspend Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f xposed-api/build.gradle
          test -f app/src/main/assets/xposed_init
          grep -q "com.example.aodsuspendtest.Entry" app/src/main/assets/xposed_init
          grep -q "project(':xposed-api')" app/build.gradle
          grep -q "include ':xposed-api'" settings.gradle

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon

      - name: Check APK version
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aod-suspend-test-v03
          path: app/build/outputs/apk/debug/app-debug.apk
